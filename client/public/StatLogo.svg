<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rounded App-Style Background -->
  <rect width="64" height="64" rx="14" fill="#2563EB" />

  <!-- Motion Speed Lines (Represents "STAT") -->
  <path d="M 4 28 H 14 M 2 36 H 12 M 4 44 H 14" stroke="#93C5FD" stroke-width="3" stroke-linecap="round" />

  <!-- Main Car Silhouette -->
  <path d="M 16 44 V 34 C 16 29 20 25 26 25 L 42 25 C 49 25 53 30 54 34 L 59 36 C 61 37 62 39 62 41 V 44 Z" fill="#FFFFFF" />

  <!-- Left Window (Rear) -->
  <path d="M 27 28 H 35 V 34 H 23 Q 23 28 27 28 Z" fill="#2563EB" />

  <!-- Right Window (Front) -->
  <path d="M 37 28 H 46 Q 51 29 52 34 H 37 Z" fill="#2563EB" />

  <!-- STAT Lightning Bolt Emblem on Door -->
  <path d="M 40 35 L 36 39 H 38 L 37 42 L 42 38 H 40 L 41 35 Z" fill="#FBBF24" />

  <!-- Wheel Wells (Reveals the background color to outline tires) -->
  <path d="M 22 44 A 6 6 0 0 1 34 44" fill="#2563EB" />
  <path d="M 44 44 A 6 6 0 0 1 56 44" fill="#2563EB" />

  <!-- Tires -->
  <circle cx="28" cy="44" r="5" fill="#0F172A" />
  <circle cx="50" cy="44" r="4.9" fill="#0F172A" />

  <!-- Silver Hubcaps -->
  <circle cx="28" cy="44" r="2" fill="#CBD5E1" />
  <circle cx="50" cy="44" r="2" fill="#CBD5E1" />
</svg>
